{{ if .Site.Params.featured.enable }}
<section id="featured" class="container-fluid">
    <div class="container px-3 px-sm-5 px-md-5 px-lg-5">
        <h2 class="text-center section-heading" id="primary-font">
            {{ .Site.Params.featured.title }}
        </h2>
        
        <div class="row justify-content-center">
            {{ range .Site.Params.featured.items }}
            <div class="col-lg-10 col-md-12 mb-4">
                <div class="featured-card">
                    <div class="card-body">
                        <h3 class="card-title">
                            <a href="{{ .link }}">
                                {{ .title }}
                            </a>
                        </h3>
                        <p class="card-text">
                            {{ .content }}
                        </p>
                        <div class="card-footer">
                            <span class="date">{{ .date }}</span>
                            <a href="{{ .link }}" class="read-btn">
                                Read
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</section>

<style>
#featured {
    padding: 0 0 40px 0;
    margin-top: -450px;
}

.section-heading {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 2rem;
    color: var(--primary-color, #fff);
}

.featured-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 2rem;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.featured-card:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
}

.featured-card .card-body {
    padding: 0;
}

.featured-card .card-title {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 1rem;
    line-height: 1.4;
}

.featured-card .card-title a {
    color: var(--primary-color, #fff);
    text-decoration: none;
    transition: color 0.2s;
}

.featured-card .card-title a:hover {
    color: var(--primary-color-light, #e0e0e0);
}

.featured-card .card-text {
    color: rgba(255, 255, 255, 0.7);
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 1.5rem;
}

.featured-card .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0;
    background: transparent;
    border: none;
}

.featured-card .date {
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
}

.featured-card .read-btn {
    color: var(--primary-color, #fff);
    text-decoration: none;
    padding: 0.5rem 1.5rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 6px;
    transition: all 0.2s;
    font-size: 0.95rem;
}

.featured-card .read-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.5);
}
</style>
{{ end }}
